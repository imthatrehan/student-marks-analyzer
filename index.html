<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Marks Analyzer</title>
    <script src="index.js" defer></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #1f2937;
      }

      .mainDiv {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      p {
        margin: 4px 0;
        font-size: 16px;
      }

      p span {
        font-weight: bold;
        color: #2563eb;
      }

      table {
        margin-top: 16px;
        min-width: 480px;
        border-collapse: collapse;
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      }

      caption {
        font-weight: bold;
        margin-bottom: 12px;
      }

      th,
      td {
        padding: 12px 16px;
        text-align: center;
      }

      thead {
        background: #2563eb;
        color: #fff;
      }

      tbody tr {
        border-bottom: 1px solid #e5e7eb;
      }

      tbody tr:nth-child(even) {
        background: #f9fafb;
      }

      tbody tr:hover {
        background: #eff6ff;
      }

      tfoot td {
        text-align: center;
        padding: 16px;
      }

      button {
        padding: 10px 24px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="mainDiv">
      <h1 style="font-size: larger">Student Marks Analyzer</h1>
      <table>
        <p>
          Topper :
          <span class="topper"></span>
        </p>
        <p>
          Class Average :
          <span class="classAverage"></span>
        </p>
        <p>
          Passed :
          <span class="passed"></span>
        </p>
        <thead>
          <tr>
            <th>Name</th>
            <th>Average</th>
            <th>Grade</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody class="tbody"></tbody>

        <tfoot>
          <tr>
            <td>
              <button class="result">Show Result</button>
            </td>
          </tr>
        </tfoot>
      </table>
    </div>
  </body>
</html>
